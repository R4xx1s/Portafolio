# Desarrollo: monta el código como volumen y corre `next dev` con recarga en vivo.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Los cambios en el código se reflejan automáticamente en http://localhost:3000.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: fernando-tocto-portfolio-dev
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
